# [26.3-web] TeaVM applies its classlib T-prefix renaming only to classes it loads THROUGH a mapping.
# A raw app class that names org.teavm.classlib.java.nio.T* types links a second, unmapped copy of
# the classlib (raw TClass -> Platform -> "not supported on current target" on WasmGC). So the
# linear-memory helper is reached under an app-side name and mapped onto its classlib-side class,
# which makes TeaVM rename every T-reference inside it to the java.* twin like any classlib class.
# Two lines because the mapper is asymmetric: the forward lookup (app name -> class file) needs the
# real T-prefixed name, while the reverse lookup (class -> app name) runs AFTER the prefix rule has
# already stripped the leading "T" (PrefixMapping.revert strips unconditionally).
mapClass|org.teavm.classlib.java.nio.TWeb263LinearMemory=org.lwjgl.system.LinearMemory
mapClass|org.teavm.classlib.java.nio.Web263LinearMemory=org.lwjgl.system.LinearMemory
# The browser sun.misc.Unsafe (see WebSunMiscUnsafe): without this the link takes the host JDK's class, whose
# allocateInstance is a native. One line: no T-prefix rule covers this package, so both lookups use this name.
mapClass|net.minecraft.client.web.WebSunMiscUnsafe=sun.misc.Unsafe
